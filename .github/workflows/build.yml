name: Build

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode（整数，可刷高以覆盖已安装版本）"
        default: "9999"
        required: true
      version_name:
        description: "versionName"
        default: "9.9.9"
        required: true
      changelog:
        description: "更新日志（发布到 Release 的说明）"
        default: "- 暂无"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -PversionCode=${{ inputs.version_code || '9999' }} \
            -PversionName=${{ inputs.version_name || '9.9.9' }} \
            --console=plain

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ inputs.version_name }}"
          apk="app/build/outputs/apk/release/FuckHome-${tag}.apk"
          mv "$(ls app/build/outputs/apk/release/*.apk | head -n1)" "$apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
            gh release edit "$tag" --title "$tag" --notes "${{ inputs.changelog }}"
          else
            gh release create "$tag" "$apk" --title "$tag" --notes "${{ inputs.changelog }}" --latest
          fi
