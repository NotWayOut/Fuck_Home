name: Build

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode（整数，可刷高以覆盖已安装版本）"
        default: "9999"
        required: true
      version_name:
        description: "versionName"
        default: "9.9.9"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -PversionCode=${{ inputs.version_code || '9999' }} \
            -PversionName=${{ inputs.version_name || '9.9.9' }} \
            --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FuckHome-${{ inputs.version_name || '9.9.9' }}
          path: app/build/outputs/apk/release/*.apk
